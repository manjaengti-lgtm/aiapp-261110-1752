name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        run: gradle assembleRelease --stacktrace
      - name: Collect APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/FullStatusShare.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FullStatusShare-apk
          path: apk/FullStatusShare.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fullstatusshare-v${{ github.run_number }}
          name: Full Status Share v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: apk/FullStatusShare.apk
      - name: Commit APK to branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f apk/FullStatusShare.apk
          git commit -m "Add built APK [skip ci]"
          git push
