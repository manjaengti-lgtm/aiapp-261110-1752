name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Signing key
        env:
          KS_B64: ${{ secrets.FAKELOC_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FAKELOC_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FAKELOC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "FAKELOC_KEY_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Using permanent signing key"
          else
            echo "::warning::No FAKELOC_KEYSTORE_B64 secret: APK signed with a temporary key (won't update over old installs)"
          fi
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not resolve" -A2 build.log | head -60 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done
      - name: Collect APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/FakeLocation.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FakeLocation-apk
          path: apk/FakeLocation.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fakelocation-v${{ github.run_number }}
          name: Fake Location v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: apk/FakeLocation.apk
      - name: Commit APK to branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f apk/FakeLocation.apk
          git commit -m "Add built APK [skip ci]"
          git push
